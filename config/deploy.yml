# Camorra en el VPS de Pantheon con Kamal 2. Los secretos no van aquí: ver .kamal/secrets.
service: camorra
image: camorra

servers:
  web:
    hosts:
      - 213.136.85.175
    options:
      memory: 768m

ssh:
  user: deploy

# Registry local de Kamal: la imagen viaja al VPS por un túnel SSH, sin GHCR ni tokens.
registry:
  server: localhost:5555

builder:
  arch: amd64

proxy:
  # Certificado de origen de Cloudflare (15 anos), no Let's Encrypt: detras del proxy de
  # Cloudflare el reto de Let's Encrypt (TLS-ALPN, puerto 443) lo contesta Cloudflare y la
  # renovacion falla. Solo lo aceptan los bordes de Cloudflare (modo Full strict): con la
  # nube gris, el navegador lo rechazaria. Ver .kamal/secrets.
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  host: camorra.florescaceres.cl
  app_port: 8080
  healthcheck:
    path: /api/health
  # Con TLS, kamal-proxy tira el X-Forwarded-For que llega y pone solo la IP de quien
  # le habla. Detras de Cloudflare esa es la del borde, no la del jugador: hay que dejarle
  # anadir la suya a la cadena que trae Cloudflare.
  forward_headers: true

env:
  clear:
    PORT: "8080"
    NODE_ENV: production
    GAME_TIMEZONE: America/Santiago
    PUBLIC_URL: https://camorra.florescaceres.cl
    # De quien se cree X-Forwarded-For: kamal-proxy (red Docker) y los bordes de Cloudflare.
    # No es un numero de saltos: con "2", quien llegara directo a la IP del VPS falsificaria su
    # IP con una cabecera. Con rangos, la cadena se lee hasta la primera IP que no es de un
    # proxy, y vale igual con el proxy de Cloudflare activado o sin el.
    # Rangos de https://www.cloudflare.com/ips (2026-11-26); si Cloudflare los cambia, actualizar.
    TRUST_PROXY: '172.16.0.0/12,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32'
  secret:
    - DATABASE_URL
    - DIRECT_URL
    # Aviso al movil de los reportes de la beta. Vacio: no se avisa.
    - NTFY_URL

accessories:
  db:
    image: postgres:16
    host: 213.136.85.175
    # Sin `port`: Postgres solo es alcanzable dentro de la red `kamal` de Docker,
    # como camorra-db:5432. Publicarlo saltaría ufw.
    env:
      clear:
        POSTGRES_USER: camorra
        POSTGRES_DB: camorra
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  # pg_dump diario a Cloudflare R2. Imagen fijada por digest: S3_PREFIX no tiene valor
  # por defecto y backup.sh corre con `set -u`, así que debe ir siempre.
  # Probar a mano: kamal accessory exec backup --reuse "sh backup.sh"
  backup:
    image: eeshugerman/postgres-backup-s3@sha256:cfcaa57732c13d0724312a2eea1ad3e385f5ed049de3c626d1ef28ecc13cdddb
    host: 213.136.85.175
    env:
      clear:
        SCHEDULE: "@daily"            # 00:00 UTC
        BACKUP_KEEP_DAYS: "30"
        POSTGRES_HOST: camorra-db
        POSTGRES_DATABASE: camorra
        POSTGRES_USER: camorra
        S3_BUCKET: pantheon-backups
        S3_PREFIX: camorra
        S3_REGION: auto
        S3_S3V4: "yes"
      secret:
        - POSTGRES_PASSWORD
        - S3_ENDPOINT
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
