name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rufianes
          POSTGRES_PASSWORD: rufianes
          POSTGRES_DB: rufianes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # En CI la base es desechable: los tests usan la misma que las migraciones.
    env:
      DATABASE_URL: postgresql://rufianes:rufianes@localhost:5432/rufianes
      TEST_DATABASE_URL: postgresql://rufianes:rufianes@localhost:5432/rufianes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # El criterio de balance de la fase 1: nada puede pasar del 60% de victorias.
      - run: pnpm balance
